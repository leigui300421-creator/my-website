<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="我的网页目录，按工作区和生活区分类浏览。">
  <title>我的网页目录</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: #1e293b;
      background: #f4f7fb;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
    }

    .intro {
      margin: 0 0 32px;
      color: #475569;
    }

    .area {
      margin-bottom: 20px;
      border: 1px solid #dbe3ee;
      border-radius: 18px;
      background: #fff;
    }

    .area summary {
      padding: 20px 24px;
      border-radius: 18px;
      cursor: pointer;
      color: #1e293b;
      font-size: 22px;
      font-weight: 700;
    }

    .area summary:hover {
      background: #eff6ff;
    }

    .area summary:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

    .area summary h2 {
      display: inline;
      margin: 0;
      font: inherit;
    }

    .area[open] summary {
      margin-bottom: 4px;
    }

    .pages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 20px;
      padding: 0 20px 20px;
      margin: 0;
      list-style: none;
    }

    .card {
      display: block;
      height: 100%;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #2563eb;
      box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
    }

    .card:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .card p {
      margin: 0 0 20px;
      color: #475569;
    }

    .card span {
      color: #1d4ed8;
      font-weight: 600;
    }

    footer {
      margin-top: 40px;
      color: #64748b;
      font-size: 14px;
    }

    [hidden] { display: none !important; }
    .password-dialog {
      width: min(400px, calc(100% - 32px));
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: 24px;
      color: #1e293b;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgb(15 23 42 / 20%);
    }
    .password-dialog::backdrop { background: rgb(15 23 42 / 45%); }
    .password-dialog h2 { margin: 0 0 8px; }
    .password-dialog p { margin: 0 0 16px; color: #475569; }
    .password-dialog label { display: block; margin-bottom: 6px; }
    .password-dialog input {
      width: 100%; min-height: 44px; padding: 10px 12px;
      font: inherit; font-size: 16px;
      border: 1px solid #94a3b8; border-radius: 8px;
    }
    .password-dialog .password-error { min-height: 24px; margin: 8px 0 16px; color: #b91c1c; font-size: 14px; }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
    .dialog-actions button {
      min-height: 44px; padding: 8px 18px; font: inherit; cursor: pointer;
      color: #1e293b; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px;
    }
    .dialog-actions .primary { color: #fff; background: #2563eb; border-color: #2563eb; }
    .password-dialog :is(input, button):focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>目录</h1>
      <p class="intro">欢迎访问。展开工作区或生活区，选择想使用的网页。</p>
    </header>

    <nav aria-label="网页目录">
      <details class="area" id="work-area">
        <summary><h2>工作区</h2></summary>
      <ul class="pages">
        <li>
          <a class="card" href="./single_wire_magnetic_simulator.html">
            <h3>单根直导线磁场分布</h3>
            <span>开始</span>
          </a>
        </li>

        <li>
          <a class="card" href="./wire_model_ampacity_evaluator.html">
            <h3>导线载流能力评估</h3>
            <!-- <p>判断矩形截面导线何时可近似为无限长、无限细模型，并比较材料载流能力与磁场误差。</p> -->
            <span>开始</span>
          </a>
        </li>

        <li>
          <a class="card" href="./Two_wire_magnetic_simulator.html">
            <h3>双导线磁场仿真</h3>
            <!-- <p>调节矩形截面、间距、高度、电流和材质，查看二维磁场与沿 X 方向的曲线。</p> -->
            <span>开始</span>
          </a>
        </li>

        <li>
          <a class="card" href="./NV_current_magnetic_imaging_evaluator.html">
            <h3>电流磁成像能力评估</h3>
            <!-- <p>用磁灵敏度、电流、距离和成像参数进行双向指标反推，并评判指定线间距的可区分性。</p> -->
            <span>开始</span>
          </a>
        </li>

        <li>
          <a class="card" href="./image-roi-analyzer.html">
            <h3>双图像 ROI 特征分析</h3>
            <!-- <p>同步读取光学图与磁场分量图，分析横向及纵向 ROI 的 FWHM 中点、零点与位置差。</p> -->
            <span>开始</span>
          </a>
        </li>

        <li>
          <a class="card" href="./pixel-brightness-filter.html">
            <h3>像素亮度筛选与配色</h3>
            <span>开始</span>
          </a>
        </li>

      </ul>
      </details>

      <details class="area" id="life-area">
        <summary><h2>生活区</h2></summary>
        <noscript><p>请启用 JavaScript 后输入密码打开生活区。</p></noscript>
        <ul class="pages" id="life-pages" hidden>
        <li>
          <a class="card" href="./pindou.html">
            <h3>图片转拼豆</h3>
            <span>开始</span>
          </a>
        </li>
      </ul>
      </details>
    </nav>

    <!-- <footer>
      本网站通过 GitHub Pages 发布。
    </footer> -->
  </main>
  <dialog id="life-password-dialog" class="password-dialog" aria-labelledby="life-password-title" aria-describedby="life-password-description">
    <form id="life-password-form">
      <h2 id="life-password-title">打开生活区</h2>
      <p id="life-password-description">请输入访问密码。</p>
      <label for="life-password">密码</label>
      <input id="life-password" type="password" inputmode="numeric" autocomplete="off" aria-describedby="life-password-error" required autofocus>
      <p id="life-password-error" class="password-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="life-password-cancel" type="button">取消</button>
        <button class="primary" type="submit">确认打开</button>
      </div>
    </form>
  </dialog>
  <script>
    const lifeArea = document.getElementById('life-area');
    const lifePages = document.getElementById('life-pages');
    const passwordDialog = document.getElementById('life-password-dialog');
    const passwordForm = document.getElementById('life-password-form');
    const passwordInput = document.getElementById('life-password');
    const passwordError = document.getElementById('life-password-error');

    lifeArea.querySelector('summary').addEventListener('click', event => {
      if (lifeArea.open) return;
      event.preventDefault();
      passwordDialog.showModal();
    });

    passwordForm.addEventListener('submit', event => {
      event.preventDefault();
      if (passwordInput.value !== '970603') {
        passwordError.textContent = '密码错误，请重试。';
        passwordInput.setAttribute('aria-invalid', 'true');
        passwordInput.focus();
        passwordInput.select();
        return;
      }
      lifePages.hidden = false;
      lifeArea.open = true;
      passwordDialog.close();
    });

    passwordInput.addEventListener('input', () => {
      passwordError.textContent = '';
      passwordInput.removeAttribute('aria-invalid');
    });

    document.getElementById('life-password-cancel').addEventListener('click', () => passwordDialog.close());

    passwordDialog.addEventListener('close', () => {
      passwordForm.reset();
      passwordError.textContent = '';
      passwordInput.removeAttribute('aria-invalid');
    });

    lifeArea.addEventListener('toggle', () => {
      if (!lifeArea.open) lifePages.hidden = true;
    });
  </script>
</body>
</html>
